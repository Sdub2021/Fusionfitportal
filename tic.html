<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>TIC — FusionFit Portal</title>
<link rel="canonical" href="https://fusionfitportal.com/tic.html">
<meta name="description" content="You are a cat. One hundred yards. Reach your human so they can rub the tics off in a circle before the lamp burns out.">
<meta name="theme-color" content="#0b0a08">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#0b0a08;
  --amber:#e8a54b;
  --lamp:#f3c27a;
  --muted:rgba(255,244,220,.5);
  --line:rgba(255,255,255,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--soil);color:#fff8ea;font-family:Outfit,system-ui,sans-serif;font-weight:300;overflow:hidden}
body{display:flex;flex-direction:column;height:100%;height:100dvh}
header{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 1rem;padding-top:max(.7rem,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:rgba(11,10,8,.92);z-index:2;
}
.brand{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.28em;font-size:1.05rem;color:inherit;text-decoration:none}
.portal{color:var(--amber);letter-spacing:.18em;text-transform:uppercase;font-size:.62rem;text-decoration:none;opacity:.85}
.portal:hover{opacity:1}
.hud{display:flex;gap:.7rem;align-items:center;font-size:.78rem;letter-spacing:.06em;flex-wrap:wrap;justify-content:flex-end}
.hud b{color:var(--amber);font-weight:500}
.bar{width:88px;height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e8a54b,#c45a3a);transform-origin:left}
.stage{flex:1;min-height:0;position:relative;width:100%}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#0b0a08}
#ui{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,7,6,.72);backdrop-filter:blur(8px);z-index:5;padding:1.2rem;
}
#ui.hidden{display:none}
.card{
  width:min(420px,100%);text-align:center;
  border:1px solid var(--line);border-radius:1.4rem;padding:1.6rem 1.3rem 1.4rem;
  background:linear-gradient(180deg,rgba(28,22,16,.95),rgba(12,10,8,.95));
}
.eyebrow{color:var(--amber);letter-spacing:.28em;text-transform:uppercase;font-size:.64rem}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(2.4rem,10vw,3.6rem);letter-spacing:.14em;margin:.25rem 0 .4rem}
.card p{color:var(--muted);line-height:1.55;margin:0 0 1.15rem}
.btn{
  border:0;border-radius:999px;padding:.9rem 1.35rem;cursor:pointer;
  background:linear-gradient(135deg,#e8a54b,#c98436);color:#1a1208;
  font:500 .75rem Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;
}
.ghost{
  margin-top:.55rem;background:transparent;border:1px solid rgba(232,165,75,.4);
  color:var(--lamp);border-radius:999px;padding:.75rem 1.1rem;cursor:pointer;
  font:400 .7rem Outfit,sans-serif;letter-spacing:.12em;text-transform:uppercase;
}
a.ghost{display:inline-block;text-decoration:none}
.stick{
  position:fixed;left:max(1rem,env(safe-area-inset-left));bottom:max(1.1rem,env(safe-area-inset-bottom));
  width:118px;height:118px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);z-index:3;display:none;touch-action:none;
}
.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(232,165,75,.75)}
@media(pointer:coarse), (max-width:820px){.stick{display:block}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:.85rem">
    <a class="portal" href="/">← FIT</a>
    <a class="brand" href="/tic.html">TIC</a>
  </div>
  <div class="hud">
    <span>Lv <b id="lv">1</b><span style="opacity:.45">/100</span></span>
    <span>Tics <b id="on">0</b></span>
    <span class="bar" title="time"><i id="timebar"></i></span>
    <span><b id="clock">0:36</b></span>
  </div>
</header>
<div class="stage"><canvas id="c"></canvas></div>
<div class="stick" id="stick"><div class="knob" id="knob"></div></div>
<div id="ui">
  <div class="card">
    <div class="eyebrow" id="eye">100 yards</div>
    <h1 id="title">TIC</h1>
    <p id="copy">You are the cat. The others are tics. Cross one hundred yards. Reach your human — they rub a circle through your fur until every tic comes off, if you arrive before the lamp burns out.</p>
    <button class="btn" id="go" type="button">Find them</button>
    <div><button class="ghost" id="how" type="button">How to move</button></div>
    <div><a class="ghost" href="/">Back to portal</a></div>
  </div>
</div>
<script src="/tic-game.js?v=20260922c"></script>
<script src="/tic-rescue.js?v=20260922c"></script>
</body>
</html>
