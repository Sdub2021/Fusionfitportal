<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FusionFitPortal — 3-Day Yin & Yang Transformation">
  <title>FusionFitPortal • Become Unstoppable</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root { --yin: #67e8f9; --yang: #f97316; }
    
    body {
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }

    .main-portal {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #05050f;
      overflow: hidden;
      color: white;
    }
    #webgl-container { position: absolute; inset: 0; z-index: 1; }

    .level-icon { width: 90px; height: 90px; margin: 0 auto 20px; }

    .level-card {
      transition: all 0.6s ease;
    }
    .level-card:hover {
      transform: scale(1.08) translateY(-25px);
    }

    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition: all 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Sound toggle */
    .sound-toggle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
    }
    .sound-toggle:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #f97316;
      transform: scale(1.08);
    }
    .sound-toggle.muted {
      opacity: 0.55;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 bg-black/95 backdrop-blur-2xl z-50 py-6 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <div class="flex items-center gap-3 text-3xl font-bold tracking-widest">
        ☯️ <span class="text-orange-500">FUSIONFIT</span>
      </div>
      <div class="hidden md:flex gap-10 text-sm font-medium">
        <a href="#levels" class="hover:text-orange-400">THE PATH</a>
        <a href="#workouts" class="hover:text-orange-400">WORKOUTS</a>
        <a href="#stories" class="hover:text-orange-400">STORIES</a>
      </div>
      <div class="flex items-center gap-4">
        <!-- Sound Toggle -->
        <button id="sound-toggle" class="sound-toggle muted" title="Toggle ambient sound" aria-label="Toggle sound">
          <!-- Speaker icon (unmuted) -->
          <svg id="icon-sound-on" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <!-- Muted icon -->
          <svg id="icon-sound-off" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <button onclick="document.getElementById('signup')?.scrollIntoView({behavior:'smooth'})" 
                class="px-8 py-4 bg-white text-black rounded-2xl font-semibold hover:bg-orange-500 hover:text-white transition-all">
          ENTER THE PORTAL
        </button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="main-portal pt-20">
    <div id="webgl-container"></div>

    <div class="relative z-20 text-center px-6 max-w-4xl mx-auto">
      <div class="inline-flex items-center gap-4 bg-white/10 backdrop-blur-md px-10 py-4 rounded-3xl border border-white/30 mb-12 text-sm tracking-widest">
        <span class="text-orange-400">✦</span> 3-DAY COSMIC RESET <span class="text-orange-400">✦</span>
      </div>
      <h1 class="mb-6 text-[5.8rem] md:text-[7.5rem] leading-none tracking-wider">FIT FUSION</h1>
      <p class="text-3xl md:text-5xl leading-tight max-w-3xl mx-auto mb-14 opacity-90">
        Ancient balance.<br>Modern power.
      </p>
      <button id="ascend-btn" 
              class="cta-btn text-white font-bold rounded-full px-16 py-8 text-2xl bg-gradient-to-r from-orange-500 to-amber-400 hover:from-orange-400 hover:to-amber-300 transition-all shadow-lg shadow-orange-500/30">
        BEGIN YOUR ASCENSION
      </button>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="max-w-7xl mx-auto px-6 py-28 bg-white text-zinc-900">
    <div class="text-center mb-20 reveal">
      <h2 class="text-6xl font-bold mb-4">The 5 Levels of Ascension</h2>
      <p class="text-2xl text-zinc-600">Click any level to see a sample workout</p>
    </div>
    
    <div class="grid md:grid-cols-5 gap-8">
      <div onclick="showWorkout(1)" class="level-card cursor-pointer bg-white p-10 rounded-3xl shadow-2xl border border-emerald-100 text-center">
        <svg class="level-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="#10b981" stroke-width="8"/>
          <path d="M30 50 Q50 30 70 50 Q50 70 30 50" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <h3 class="text-3xl font-bold">Level 1</h3>
        <p class="text-emerald-600 font-semibold">Yin Awakening</p>
      </div>

      <div onclick="showWorkout(2)" class="level-card cursor-pointer bg-white p-10 rounded-3xl shadow-2xl border border-orange-100 text-center">
        <svg class="level-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 20 L65 45 L85 50 L65 55 L50 80 L35 55 L15 50 L35 45 Z" fill="#f97316"/>
        </svg>
        <h3 class="text-3xl font-bold">Level 2</h3>
        <p class="text-orange-600 font-semibold">Yang Ignition</p>
      </div>

      <div onclick="showWorkout(3)" class="level-card cursor-pointer bg-white p-10 rounded-3xl shadow-2xl border border-cyan-100 text-center">
        <svg class="level-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 50 Q40 20 60 35 Q80 50 60 65 Q40 80 20 50" fill="#22d3ee" opacity="0.7"/>
        </svg>
        <h3 class="text-3xl font-bold">Level 3</h3>
        <p class="text-cyan-600 font-semibold">Fusion Harmony</p>
      </div>

      <div onclick="showWorkout(4)" class="level-card cursor-pointer bg-white p-10 rounded-3xl shadow-2xl border border-purple-100 text-center">
        <svg class="level-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 15 L65 35 L85 40 L70 60 L50 80 L30 60 L15 40 L35 35 Z" fill="#a855f7" opacity="0.8"/>
        </svg>
        <h3 class="text-3xl font-bold">Level 4</h3>
        <p class="text-purple-600 font-semibold">Symbolic Elevation</p>
      </div>

      <div onclick="showWorkout(5)" class="level-card cursor-pointer bg-white p-10 rounded-3xl shadow-2xl border border-pink-100 text-center">
        <svg class="level-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 20 Q30 40 35 65 Q50 85 65 65 Q70 40 50 20" fill="#ec4899"/>
        </svg>
        <h3 class="text-3xl font-bold">Level 5</h3>
        <p class="text-pink-600 font-semibold">Lotus Mastery</p>
      </div>
    </div>
  </section>

  <!-- WORKOUT MODAL -->
  <div id="workout-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full mx-4 p-10 relative">
      <button onclick="closeModal()" class="absolute top-6 right-6 text-4xl text-zinc-400 hover:text-white">×</button>
      <div id="modal-content" class="text-white"></div>
    </div>
  </div>

  <script>
    // ==================== AUDIO SYSTEM ====================
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let oscillators = [];
    let ambientStarted = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.12; // gentle volume
      masterGain.connect(audioCtx.destination);
    }

    function createAmbientPad() {
      if (!audioCtx) initAudio();

      // Low yin drone
      const drone = audioCtx.createOscillator();
      drone.type = 'sine';
      drone.frequency.value = 55; // A1 – grounding

      const droneGain = audioCtx.createGain();
      droneGain.gain.value = 0.35;

      // Soft filter for warmth
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 280;
      filter.Q.value = 0.7;

      drone.connect(filter);
      filter.connect(droneGain);
      droneGain.connect(masterGain);

      // Higher yang pad (slowly detuned for movement)
      const pad = audioCtx.createOscillator();
      pad.type = 'sine';
      pad.frequency.value = 220; // A3

      const padGain = audioCtx.createGain();
      padGain.gain.value = 0.18;

      const padFilter = audioCtx.createBiquadFilter();
      padFilter.type = 'lowpass';
      padFilter.frequency.value = 900;

      // Gentle LFO for breathing movement
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.08; // very slow breath rate

      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 12; // subtle pitch wobble

      lfo.connect(lfoGain);
      lfoGain.connect(pad.frequency);

      pad.connect(padFilter);
      padFilter.connect(padGain);
      padGain.connect(masterGain);

      // Soft high shimmer
      const shimmer = audioCtx.createOscillator();
      shimmer.type = 'triangle';
      shimmer.frequency.value = 880;

      const shimmerGain = audioCtx.createGain();
      shimmerGain.gain.value = 0.04;

      const shimmerFilter = audioCtx.createBiquadFilter();
      shimmerFilter.type = 'highpass';
      shimmerFilter.frequency.value = 600;

      shimmer.connect(shimmerFilter);
      shimmerFilter.connect(shimmerGain);
      shimmerGain.connect(masterGain);

      // Start everything
      const now = audioCtx.currentTime;
      drone.start(now);
      pad.start(now);
      shimmer.start(now);
      lfo.start(now);

      oscillators = [drone, pad, shimmer, lfo];
      isPlaying = true;
      ambientStarted = true;

      updateSoundUI(true);
    }

    function stopAmbient() {
      if (!isPlaying) return;
      oscillators.forEach(osc => {
        try { osc.stop(); } catch(e) {}
      });
      oscillators = [];
      isPlaying = false;
      updateSoundUI(false);
    }

    function toggleSound() {
      initAudio();

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlaying) {
        stopAmbient();
      } else {
        createAmbientPad();
      }
    }

    function playPortalTone() {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;

      // Rising whoosh / activation tone
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 1.4);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.22, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(200, now);
      filter.frequency.exponentialRampToValueAtTime(1200, now + 1.2);
      filter.Q.value = 2;

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain || audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.7);
    }

    function updateSoundUI(playing) {
      const btn = document.getElementById('sound-toggle');
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');

      if (playing) {
        btn.classList.remove('muted');
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        btn.classList.add('muted');
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    // ==================== THREE.JS ====================
    let scene, camera, renderer, stars, nebula;

    function initWebGL() {
      const container = document.getElementById('webgl-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
      camera.position.z = 1100;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Stars
      const starGeo = new THREE.BufferGeometry();
      const starCount = 16000;
      const pos = new Float32Array(starCount * 3);
      const col = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        const r = Math.random() * 2400 + 400;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        pos[i] = r * Math.sin(p) * Math.cos(t);
        pos[i+1] = r * Math.sin(p) * Math.sin(t);
        pos[i+2] = r * Math.cos(p) - 900;

        const b = Math.random() * 0.8 + 0.4;
        col[i] = b; col[i+1] = b * 0.95; col[i+2] = 1;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const starMat = new THREE.PointsMaterial({ size: 2.8, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
      stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // Nebula
      const nebGeo = new THREE.BufferGeometry();
      const nebCount = 2500;
      const nPos = new Float32Array(nebCount * 3);
      const nCol = new Float32Array(nebCount * 3);

      for (let i = 0; i < nebCount * 3; i += 3) {
        nPos[i] = (Math.random() - 0.5) * 2200;
        nPos[i+1] = (Math.random() - 0.5) * 1600;
        nPos[i+2] = (Math.random() - 0.5) * 1200 - 700;

        const mix = Math.random();
        nCol[i] = 0.3 + mix * 0.6;
        nCol[i+1] = 0.4 + mix * 0.5;
        nCol[i+2] = 0.7 + mix * 0.3;
      }

      nebGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
      nebGeo.setAttribute('color', new THREE.BufferAttribute(nCol, 3));

      const nebMat = new THREE.PointsMaterial({
        size: 55,
        vertexColors: true,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthTest: false
      });

      nebula = new THREE.Points(nebGeo, nebMat);
      scene.add(nebula);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (stars) stars.rotation.y += 0.0002;
      if (nebula) nebula.rotation.y += 0.0001;
      renderer.render(scene, camera);
    }

    // ==================== WORKOUT MODAL ====================
    function showWorkout(level) {
      const modal = document.getElementById('workout-modal');
      const content = document.getElementById('modal-content');
      
      let html = `<h2 class="text-4xl font-bold mb-6 text-orange-400">Level ${level} Sample</h2>`;
      
      if (level === 1) html += `<p class="mb-8 text-zinc-400">Gentle Yin Awakening</p><ul class="space-y-4 text-lg"><li>• 5 min slow Tai Chi flow</li><li>• 10 controlled squats</li><li>• 3 min child's pose + breathwork</li></ul>`;
      else if (level === 2) html += `<p class="mb-8 text-zinc-400">Yang Power Ignition</p><ul class="space-y-4 text-lg"><li>• 8 Push-ups</li><li>• 20 Mountain Climbers per side</li><li>• 12 Squats or Jump Squats</li></ul>`;
      else html += `<p class="text-zinc-400">Full detailed workout coming inside the portal.</p>`;

      content.innerHTML = html;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('workout-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // ==================== INIT ====================
    window.onload = () => {
      initWebGL();

      // Sound toggle
      document.getElementById('sound-toggle').addEventListener('click', toggleSound);

      // Ascension button → play portal tone + scroll
      document.getElementById('ascend-btn').addEventListener('click', () => {
        if (isPlaying || ambientStarted) {
          playPortalTone();
        } else {
          // First interaction also starts ambient
          toggleSound();
          setTimeout(playPortalTone, 180);
        }
        // Scroll if signup exists later
        const signup = document.getElementById('signup');
        if (signup) signup.scrollIntoView({ behavior: 'smooth' });
      });

      // Scroll reveals
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.reveal, .level-card').forEach(el => observer.observe(el));
    };
  </script>
</body>
</html>
