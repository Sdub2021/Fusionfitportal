<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIT — Enter the Portal</title>
  <meta name="description" content="FusionFitPortal. Ancient balance. Modern power.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#05050f">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0; height: 100%; background: #03030a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif; overflow: hidden;
    }
    #space {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 50% 50%, #12081f 0%, #03030a 62%);
    }
    canvas#stars { position: fixed; inset: 0; z-index: 1; }
    .stage {
      position: relative; z-index: 2;
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .vortex-wrap {
      position: relative; width: min(72vw, 420px); height: min(72vw, 420px);
      cursor: pointer; border: 0; background: none; padding: 0;
    }
    .ring {
      position: absolute; inset: 0; margin: auto; border-radius: 50%;
      border: 1px solid rgba(249, 115, 22, 0.22);
      box-shadow: 0 0 18px rgba(124, 58, 237, 0.15);
    }
    .r1 { width: 28%; height: 28%; animation: spin 9s linear infinite, breathe 3.4s ease-in-out infinite; border-color: rgba(255,255,255,.35); }
    .r2 { width: 46%; height: 46%; animation: spin 14s linear infinite reverse, breathe 4s ease-in-out infinite; }
    .r3 { width: 64%; height: 64%; animation: spin 18s linear infinite, breathe 5s ease-in-out infinite; border-color: rgba(167,139,250,.35); }
    .r4 { width: 82%; height: 82%; animation: spin 24s linear infinite reverse; opacity: .7; }
    .r5 { width: 100%; height: 100%; animation: spin 32s linear infinite; opacity: .45; }
    .core {
      position: absolute; inset: 0; margin: auto; width: 16%; height: 16%;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #fdba74 28%, #f97316 52%, #7c3aed 100%);
      box-shadow: 0 0 40px #f97316, 0 0 90px #7c3aed;
      animation: core 2.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: .75; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes core {
      0%,100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.18); filter: brightness(1.35); }
    }
    .suck .vortex-wrap { animation: suck 1.15s ease-in forwards; }
    @keyframes suck {
      0% { transform: scale(1); filter: blur(0); }
      70% { transform: scale(2.4); filter: blur(2px); opacity: 1; }
      100% { transform: scale(8); filter: blur(16px); opacity: 0; }
    }
    .copy { margin-top: 28px; pointer-events: none; }
    .hint { letter-spacing: .42em; font-size: 11px; color: #fdba74; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 800; margin: 10px 0 6px; letter-spacing: .04em; }
    .sub { color: #a1a1aa; font-size: .95rem; }
    .levels {
      position: fixed; inset: 0; z-index: 3;
      display: none; align-items: center; justify-content: center;
      background: rgba(3,3,10,.55); backdrop-filter: blur(8px);
      padding: 24px;
    }
    .levels.show { display: flex; }
    .levels-inner { max-width: 920px; width: 100%; }
    .level {
      display: block; text-decoration: none; color: inherit;
      background: rgba(24,24,27,.82); border: 1px solid rgba(63,63,70,.9);
      border-radius: 18px; padding: 18px 14px; text-align: center;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .level:hover {
      transform: translateY(-4px);
      border-color: rgba(249,115,22,.7);
      box-shadow: 0 0 28px rgba(249,115,22,.2);
    }
    .back {
      margin-top: 22px; color: #a1a1aa; background: none; border: 0;
      cursor: pointer; letter-spacing: .16em; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="space"></div>
  <canvas id="stars"></canvas>

  <div class="stage" id="stage">
    <button class="vortex-wrap" id="portal" aria-label="Enter the portal">
      <span class="ring r5"></span>
      <span class="ring r4"></span>
      <span class="ring r3"></span>
      <span class="ring r2"></span>
      <span class="ring r1"></span>
      <span class="core"></span>
    </button>
    <div class="copy">
      <p class="hint">HEALING FIELD ACTIVE</p>
      <h1>ENTER THE PORTAL</h1>
      <p class="sub">Ancient balance. Modern power.</p>
    </div>
  </div>

  <div class="levels" id="levels">
    <div class="levels-inner">
      <p class="hint text-center mb-2">THE PATH</p>
      <h2 class="text-2xl md:text-3xl font-bold text-center mb-8">5 Levels of Ascension</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <a class="level" href="/level-1.html">
          <div class="text-3xl mb-2">🌑</div>
          <p class="text-xs text-zinc-500">Level 1</p>
          <strong>Yin Awakening</strong>
        </a>
        <div class="level opacity-50">
          <div class="text-3xl mb-2">🔥</div>
          <p class="text-xs text-zinc-500">Level 2</p>
          <strong>Yang Ignition</strong>
        </div>
        <div class="level opacity-50">
          <div class="text-3xl mb-2">☯️</div>
          <p class="text-xs text-zinc-500">Level 3</p>
          <strong>Fusion Harmony</strong>
        </div>
        <div class="level opacity-50">
          <div class="text-3xl mb-2">✦</div>
          <p class="text-xs text-zinc-500">Level 4</p>
          <strong>Symbolic Elevation</strong>
        </div>
        <div class="level opacity-50">
          <div class="text-3xl mb-2">🪷</div>
          <p class="text-xs text-zinc-500">Level 5</p>
          <strong>Lotus Mastery</strong>
        </div>
      </div>
      <div class="text-center">
        <button class="back" id="close-levels">← RETURN TO PORTAL</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    function resize() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
      stars = Array.from({ length: 140 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random() * 2 + 0.2,
        r: Math.random() * 1.4 + 0.2
      }));
    }
    addEventListener('resize', resize);
    resize();
    (function draw() {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2;
      for (const s of stars) {
        s.x += (s.x - cx) * 0.0009 * s.z;
        s.y += (s.y - cy) * 0.0009 * s.z;
        if (s.x < 0 || s.x > w || s.y < 0 || s.y > h) {
          s.x = cx + (Math.random() - 0.5) * 80;
          s.y = cy + (Math.random() - 0.5) * 80;
        }
        ctx.fillStyle = `rgba(255,255,255,${0.25 + s.z * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    })();

    const stage = document.getElementById('stage');
    const levels = document.getElementById('levels');
    document.getElementById('portal').addEventListener('click', () => {
      stage.classList.add('suck');
      setTimeout(() => {
        levels.classList.add('show');
        stage.classList.remove('suck');
      }, 900);
    });
    document.getElementById('close-levels').addEventListener('click', () => {
      levels.classList.remove('show');
    });
  </script>
</body>
</html>
